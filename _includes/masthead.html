{% include base_path %}

<style>
  .masthead .masthead__menu {
    width: 100%;
  }

  .custom-site-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    box-sizing: border-box;
  }

  .custom-site-title {
    font-weight: 700;
    white-space: nowrap;
    color: inherit;
    text-decoration: none !important;
  }

  .custom-nav-links {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 32px;
    list-style: none;
    margin: 0 0 0 auto;
    padding: 0;
  }

  .custom-nav-links li {
    margin: 0;
    padding: 0;
    white-space: nowrap;
  }

  .custom-nav-links a {
    color: inherit;
    font-weight: 400;
    text-decoration: none !important;
  }

  .custom-nav-links a:hover {
    color: #64748b;
  }

  @media (max-width: 768px) {
    .custom-site-nav {
      flex-wrap: wrap;
      gap: 16px;
    }

    .custom-nav-links {
      flex-wrap: wrap;
      gap: 15px;
    }
  }
</style>

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">

      <nav class="custom-site-nav">

        <!-- Website name on the left -->

        <a class="custom-site-title"
           href="{{ base_path }}/">
          {{ site.title }}
        </a>

        <!-- Navigation links on the right -->

        <ul class="custom-nav-links">

          {% for link in site.data.navigation.main %}

            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}

            <li>
              <a href="{{ domain }}{{ link.url }}">
                {{ link.title }}
              </a>
            </li>

          {% endfor %}

        </ul>

      </nav>

    </div>
  </div>
</div>
